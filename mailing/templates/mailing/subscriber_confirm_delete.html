{% extends 'mailing/base.html' %}
{% block content %}
<title>Удалить получателя рассылки</title>
<div class="container mt-5">
        <h1 class="mb-4">Удалить получателя рассылки</h1>
        <p>Вы уверены, что хотите удалить "{{ object.fio }}"?</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Удалить</button>
            <a href="{% url 'mailing:subscriber_list' %}" class="btn btn-secondary">Отмена</a>
        </form>
    </div>
    {% endblock %}
