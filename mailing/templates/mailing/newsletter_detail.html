{% extends 'mailing/base.html' %}

{% block content %}
<div class="album py-5 bg-body-tertiary">
    <div class="container">
        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">
            <div class="col">
                <div class="card shadow-sm">

                    <div class="card-body">
                        <p class="card-text">Рассылка id {{ object.pk }}</p>
                        <p class="card-text">Статус рассылки: {{ object.status }}</p>
                        <p class="card-text">Рассылка запущена {{ object.start_sent_at }}</p>
                        <p class="card-text">Рассылка остановлена {{ object.finish_sent_at }}</p>
                        <div class="d-flex justify-content-between align-items-center">
                            <div class="btn-group">
                                <a class="btn btn-primary" href="{% url 'mailing:newsletter_list' %}"
                                   role="button">Назад</a>
                                <a class="btn btn-warning" href="{% url 'mailing:newsletter_update' newsletter.pk %}"
                                   role="button">Редактировать</a>
                                <a class="btn btn-danger" href="{% url 'mailing:newsletter_confirm_delete' newsletter.pk %}"
                                   role="button">Удалить</a>

                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    {% endblock %}
